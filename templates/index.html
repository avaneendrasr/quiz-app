<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Quiz Pro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<script id="subjects-data" type="application/json">
{{ subjects | tojson }}
</script>

<button id="menuBtn" onclick="toggleMenu()">☰</button>

<div id="left">
    <div id="controls">

        <select id="subjectSelect" onchange="loadFiles()">
            <option value="">📚 Select Subject</option>
            {% for subject in subjects %}
            <option value="{{subject}}">📘 {{subject.capitalize()}}</option>
            {% endfor %}
        </select>

        <select id="fileSelect">
            <option value="">📝 Select Test</option>
        </select>

        <button onclick="start()">▶️ Start</button>
        <button onclick="shuffle()">🔀 Shuffle</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <button onclick="toggleDarkMode()">🌙 Dark Mode</button>

    </div>

    <div id="palette"></div>
</div>

<div id="right">
    <div class="card">

        <select id="filterBox" style="display:none;" onchange="applyFilter(this.value)">
            <option value="all">📋 All Questions</option>
            <option value="correct">✅ Correct</option>
            <option value="wrong">❌ Incorrect</option>
            <option value="skipped">⏭ Skipped</option>
        </select>

        <div class="content">
            <div id="questionBox"></div>
            <div id="optionsBox"></div>
            <div id="explanation"></div>
        </div>

        <div id="score"></div>

        <div id="buttonBar">
            <button onclick="prev()">⬅️ Prev</button>
            <button onclick="next()">➡️ Next</button>
            <button onclick="copyQ()">📋 Copy</button>

            <select id="aiSelect">
                <option value="">🤖 Ask AI</option>
                <option value="google">🔎 Google</option>
                <option value="chatgpt">💬 ChatGPT</option>
                <option value="gemini">✨ Gemini</option>
            </select>
        </div>

        <button id="submitBtn" class="submit-btn" onclick="submitQuiz()">✅ Submit Test</button>

    </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
